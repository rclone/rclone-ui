[package]
name = "rclone-ui-server"
description = "Rclone UI's server: the shared core behind an HTTP/WebSocket API, serving the frontend to browser tabs and to the desktop app's windows alike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "rclone_ui_server"
path = "src/lib.rs"

[[bin]]
name = "rclone-ui-server"
path = "src/main.rs"

[dependencies]
rclone-ui-shared = { path = "../src-shared" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
reqwest.workspace = true
tokio.workspace = true
uuid.workspace = true
dirs.workspace = true
chrono.workspace = true
sysinfo.workspace = true
axum = { version = "0.8", features = ["ws", "http1", "json", "tokio", "query"] }
futures-util = "0.3"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
subtle = "2"
# Account passwords (team.rs): argon2id PHC strings. Pure Rust, no system libraries.
argon2 = { version = "0.5", features = ["std"] }
bytes = "1"
percent-encoding = "2"
minisign-verify = "0.2"
base64 = "0.22"
opener = { workspace = true }
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }

[target.'cfg(target_os = "windows")'.dependencies]
winreg.workspace = true

[features]
# A debug build reads `src-frontend/dist/` from the checkout at runtime; a debug binary meant
# for another machine (cargo zigbuild / cargo xwin) needs the bundle inside it like a release build.
embed = ["rust-embed/debug-embed"]

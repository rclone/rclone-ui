name: release-cloud

on:
  push:
    tags: ['cloud-v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # This workflow builds the cloud branch and nothing else. main carries the same file so GitHub
  # lists it and offers "Run workflow"; run on any other branch, or for a cloud-v* tag whose
  # commit is not on cloud, it stops here before anything is built or published.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: The ref is cloud, or a tag on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/cloud) exit 0 ;;
            refs/tags/cloud-v*)
              # On cloud: cloud is the tagged commit, or ahead of it.
              status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...cloud" --jq .status)"
              if [ "$status" = "ahead" ] || [ "$status" = "identical" ]; then exit 0; fi
              echo "::error::$GITHUB_REF_NAME is not on the cloud branch ($status)"
              exit 1 ;;
          esac
          echo "::error::release-cloud builds the cloud branch only; run it with cloud selected (got $GITHUB_REF)"
          exit 1

  binaries:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-14
            target: macos-aarch64
          - os: macos-13
            target: macos-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p out/cloud
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/rclone-cloud.exe out/cloud/rclone-cloud-${{ matrix.target }}.exe
          else
            cp target/release/rclone-cloud out/cloud/rclone-cloud-${{ matrix.target }}
          fi
      # The server updates itself from these binaries: sign them (minisign) so src/updater.rs
      # can verify what it downloads. The key is a minisign key; the secret keeps the name it
      # had when the desktop app and the cloud shared one signer, and renaming it is a change
      # to the repository's settings, not to this file.
      - name: Sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in out/cloud/rclone-cloud-*; do
            npx --yes @tauri-apps/cli@2 signer sign "$f"
          done
          ls -la out/cloud
      - uses: actions/upload-artifact@v4
        with:
          name: rclone-cloud-${{ matrix.target }}
          path: out/cloud/*
      # Never the repo's Latest: that release is the desktop app's, whose updater reads
      # `releases/latest/download/latest.json`.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/cloud/*
          make_latest: false

  # `cloud-latest.json`: what `rclone-cloud` polls to update itself, with `cloud-<os>-<arch>`
  # platform keys pointing at the signed binaries above. It is read from the rolling
  # `cloud-latest` release, whose URL never moves: GitHub's own "latest" is the desktop app's.
  manifest:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rclone-cloud-*
          path: artifacts
          merge-multiple: true
      - name: Write cloud-latest.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#cloud-v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          platforms="{}"
          for sig in artifacts/*.sig; do
            bin="${sig%.sig}"
            name="$(basename "$bin")"
            key="${name#rclone-cloud-}"
            key="cloud-${key%.exe}"
            platforms="$(jq --arg k "$key" --arg u "${base}/${name}" --arg s "$(cat "$sig")" \
              '.[$k] = {url: $u, signature: $s}' <<<"$platforms")"
          done
          jq -n --arg v "$version" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, notes: "See the release notes on GitHub.", pub_date: $d, platforms: $p}' \
            > cloud-latest.json
          cat cloud-latest.json
      - name: Keep it with the version
        uses: softprops/action-gh-release@v2
        with:
          files: cloud-latest.json
          make_latest: false
      - name: Point the rolling release at it
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cloud-latest
          target_commitish: ${{ github.sha }}
          name: Rclone Cloud update pointer
          body: |
            Not a version. `cloud-latest.json` is what a running rclone-cloud reads to find its
            newest release; the binaries are on the `cloud-v*` releases.
          files: cloud-latest.json
          make_latest: false

  image:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rclone-cloud
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

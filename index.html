<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rclone UI</title>
	<script>
		// Apply the theme that the last window saved (src/main.tsx), so that the page has it
		// before the prefs are read. The default must match PREF_DEFAULTS.theme.
		{
			const t = localStorage.theme ?? "dark";
			document.documentElement.classList.toggle(
				"dark",
				t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches),
			);
		}
	</script>
	<script>
		if (
			window.location.pathname.startsWith('/startup')
		) {
			document.documentElement.classList.add('bg-transparent!')
		}
	</script>
  </head>

  <body class="select-none">
    <div id="root"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>

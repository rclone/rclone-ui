<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Last supported wins: the SVG follows the tab strip, the PNG is the fallback. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rclone Cloud</title>
    <!-- rclone-cloud:boot -->
	<script>
		// The tab's theme (lib/theme.ts keeps it under this key); first paint matches it.
		var theme = localStorage.getItem("shell.theme")
		document.documentElement.classList.toggle(
			"dark",
			theme === "dark" ||
				(theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches),
		);
	</script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
